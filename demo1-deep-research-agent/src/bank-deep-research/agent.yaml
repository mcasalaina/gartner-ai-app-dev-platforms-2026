# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: bank-deep-research
description: Multi-agent, Web IQ-grounded bank strategy research for Gartner Demo 1.
protocols:
  - protocol: invocations
    version: 2.0.0
resources:
  cpu: '1'
  memory: 2Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_AI_RESEARCH_MODEL_DEPLOYMENT_NAME
    value: gpt-5.4-mini
  - name: AZURE_AI_RESEARCH_MODEL_DEPLOYMENT_NAME_SECONDARY
    value: gpt-5.4-mini-research
  - name: RESEARCH_CONCURRENCY
    value: '2'
  - name: TOOLBOX_ENDPOINT
    value: ${TOOLBOX_ENDPOINT}
  - name: APPLICATIONINSIGHTS_CONNECTION_STRING
    value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
