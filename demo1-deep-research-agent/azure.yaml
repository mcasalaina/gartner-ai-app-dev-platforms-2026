# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.6'
name: gartner-bank-deep-research
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 100
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini-research
              sku:
                capacity: 100
                name: GlobalStandard
            - model:
                format: OpenAI
                name: model-router
                version: "2025-11-18"
              name: model-router
              sku:
                capacity: 10
                name: GlobalStandard
    bank-deep-research:
        project: src/bank-deep-research
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: Multi-agent, Web IQ-grounded bank strategy research for Gartner Demo 1.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_AI_RESEARCH_MODEL_DEPLOYMENT_NAME
              value: gpt-5.4-mini
            - name: AZURE_AI_RESEARCH_MODEL_DEPLOYMENT_NAME_SECONDARY
              value: gpt-5.4-mini-research
            - name: RESEARCH_CONCURRENCY
              value: "2"
            - name: TOOLBOX_ENDPOINT
              value: ${TOOLBOX_ENDPOINT}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
        kind: hosted
        metadata:
            tags:
                - Gartner Demo 1
                - Deep Research
                - Web IQ
                - Human in the Loop
                - Invocations Protocol
        name: bank-deep-research
        protocols:
            - protocol: invocations
              version: 2.0.0
infra:
    provider: microsoft.foundry
hooks:
    postprovision:
        shell: sh
        run: ./infra/provision-secondary.sh
