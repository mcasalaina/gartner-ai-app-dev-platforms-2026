[project]
name = "bank-servicing-backend"
version = "0.1.0"
description = "Authenticated FastAPI backend for the Bank Servicing Agent"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.11.13,<4",
  "azure-monitor-opentelemetry>=1.8,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "msal>=1.32,<2",
  "pydantic>=2.11,<3",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.35,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_servicing_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
