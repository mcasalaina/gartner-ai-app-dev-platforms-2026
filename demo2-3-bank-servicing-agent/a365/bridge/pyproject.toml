[project]
name = "bank-servicing-bridge"
version = "0.1.0"
description = "Standalone Agent 365 bridge for the Bank Servicing Agent"
requires-python = ">=3.13"
dependencies = [
  "azure-monitor-opentelemetry>=1.8,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "microsoft-agents-activity>=0.7,<1",
  "microsoft-agents-authentication-msal>=0.7,<1",
  "microsoft-agents-hosting-aiohttp>=0.7,<1",
  "microsoft-agents-hosting-core>=0.7,<1",
  "microsoft-agents-a365-notifications>=0.1,<1",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_servicing_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
